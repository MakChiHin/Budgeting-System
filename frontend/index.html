<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>口頭帳 — 理財助手</title>
  <meta name="theme-color" content="#1b3a4b" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css?v=5" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="avatar">帳</div>
      <div class="brand">
        <h1>口頭帳</h1>
        <p>講一句就記低 · 粵英夾雜都得</p>
      </div>
      <div class="header-meta">
        <span class="badge" id="modelBadge">NER: 規則引擎</span>
        <button type="button" class="gear" id="gearBtn" title="喜好">⚙</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel active" id="chat">
        <div class="chat" id="chatLog"></div>
        <div class="chips" id="chips">
          <button data-q="頭先喺老麥食咗個餐畀咗四十幾蚊">老麥四十幾蚊</button>
          <button data-q="今日搭車用咗30蚊">搭車 30 蚊</button>
          <button data-q="用 PayMe 過咗一百五十蚊畀阿明夾錢">過數畀阿明</button>
          <button data-q="呢個月飲食係咪超支？">飲食超支未？</button>
        </div>
        <form class="composer" id="composer">
          <button type="button" class="ghost" id="micBtn" title="語音">🎤</button>
          <input id="input" autocomplete="off" placeholder="例如：今日搭車用咗 30 蚊" />
          <button type="submit" title="傳送">➤</button>
        </form>
      </section>

      <section class="panel" id="history">
        <div class="pane-head">
          <h2>歷史記錄</h2>
          <p id="bookCount">未有記錄。入帳之後先會出現。</p>
        </div>
        <div class="list" id="bookList"></div>
      </section>

      <section class="panel" id="chart">
        <div class="pane-head">
          <h2>本月用喺邊</h2>
          <p id="chartMonth"></p>
        </div>
        <div class="budget-box">
          <label class="hint" for="budgetInput">每月上限（HKD）</label>
          <input id="budgetInput" type="number" min="0" step="100" value="5000" />
          <div class="bar" id="budgetBar"><span style="width:0%"></span></div>
          <p class="hint" id="budgetText">未有交易</p>
          <div class="hbars" id="catBars"></div>
        </div>
      </section>
    </main>

    <nav class="dock" id="dock">
      <button class="active" data-tab="chat">傾偈</button>
      <button data-tab="history">歷史</button>
      <button data-tab="chart">圖表</button>
    </nav>

    <div class="sheet-back" id="sheetBack" hidden>
      <form class="sheet" id="prefSheet">
        <h2>喜好</h2>
        <p class="hint">冇講清楚嘅句子，會用呢度預填。確認卡仍然可以改，撳入帳先寫入歷史。</p>
        <label>搭車通常用
          <select name="transport" id="prefTransport">
            <option>港鐵</option>
            <option>巴士</option>
            <option>小巴</option>
            <option>的士</option>
            <option>紅Van</option>
            <option>未設定</option>
          </select>
        </label>
        <label>搭車預設用途
          <input name="transport_purpose" id="prefPurpose" placeholder="例如：返工、返學" />
        </label>
        <label>預設支付
          <select name="payment" id="prefPay">
            <option>Octopus</option>
            <option>PayMe</option>
            <option>FPS</option>
            <option>AlipayHK</option>
            <option>WeChat Pay</option>
            <option>Credit Card</option>
            <option>Cash</option>
            <option>Unknown</option>
          </select>
        </label>
        <div class="actions">
          <button type="button" class="no" id="prefClose">關閉</button>
          <button type="submit" class="ok">儲存</button>
        </div>
      </form>
    </div>
  </div>
  <script src="./app.js?v=5"></script>
</body>
</html>
